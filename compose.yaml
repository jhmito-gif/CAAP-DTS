name: caap-dts-test

x-app: &app
  image: caap-dts-test-app:local
  build:
    context: .
    target: app
  env_file:
    - .env.docker
  init: true
  volumes:
    - app-storage:/var/www/html/storage

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env.docker
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 --user="$$MYSQL_USER" --password="$$MYSQL_PASSWORD" --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  migrate:
    <<: *app
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]

  app:
    <<: *app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: caap-dts-test-web:local
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - app-storage:/var/www/html/storage:ro

  worker:
    <<: *app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      [
        "php",
        "artisan",
        "queue:work",
        "--sleep=3",
        "--tries=3",
        "--timeout=300",
        "--max-time=3600",
        "--no-interaction",
      ]
    stop_grace_period: 330s

  scheduler:
    <<: *app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    stop_grace_period: 330s

  artisan:
    <<: *app
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    command: ["php", "artisan", "list"]

volumes:
  app-storage:
  mysql-data:
